<!-- marketing-audit report look, cut from the skill's locked template: the <style> block, the icon <symbol>s and the photo viewer script, exactly as they are. lib/report/render.ts uses only these 3 parts and fills the content itself. -->
<style>
  :root {
    color-scheme: light;
    --page: #F3F4F6;
    --surface: #FFFFFF;
    --soft: #F2F3F6;
    --ink: #111317;
    --ink-2: #3A3F4A;
    --muted: #6B717E;
    --faint: #B9BEC8;
    --line: #E3E5EA;
    --line-2: #CDD1D8;
    --bad: #B42318;      /* the only colour: a problem to fix */
    --display: "Schibsted Grotesk", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --body: "Geist", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    --mono: "Geist Mono", ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6; }
  a { color: var(--ink); text-decoration-color: var(--line-2); text-underline-offset: 3px; }
  a:hover { text-decoration-color: var(--ink); }
  a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px; }
  h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
  p { margin: 0; }
  .mono { font-family: var(--mono); font-size: 0.88em; }
  .muted { color: var(--muted); }
  .eyebrow { font-size: 13px; font-weight: 500; color: var(--muted); }
  .bad { color: var(--bad); }

  /* status = icon + word. Shape carries the meaning; red only for problems */
  .ico { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .st { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; white-space: nowrap; color: var(--ink); }
  .st.is-bad { color: var(--bad); }
  .st.is-na { color: var(--muted); font-weight: 500; }

  /* top bar */
  .topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: rgba(255,255,255,0.97); border-bottom: 1px solid var(--line); }
  .topbar .in { max-width: 1120px; margin-inline: auto; padding-inline: 16px; height: 56px; display: flex; align-items: center; gap: 18px; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 15px; white-space: nowrap; }
  .brand img { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); }
  .brand span { color: var(--muted); font-weight: 600; }
  .jump { display: flex; gap: 2px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
  .jump::-webkit-scrollbar { display: none; }
  .jump a { color: var(--ink-2); text-decoration: none; font-size: 13.5px; font-weight: 500; padding: 7px 10px; border-radius: 7px; white-space: nowrap; }
  .jump a:hover { background: var(--soft); color: var(--ink); }
  @media (max-width: 760px) { .brand span { display: none; } .jump { margin-left: 0; } }

  main { max-width: 1120px; margin-inline: auto; padding-inline: 16px; padding-block: 24px 72px; display: grid; gap: 20px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: clamp(20px, 3.4vw, 40px); scroll-margin-top: 72px; }

  /* cover */
  .cover { display: grid; gap: 28px; }
  .cover-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: start; }
  .cover h1 { font-size: clamp(44px, 7.5vw, 76px); font-weight: 800; line-height: 0.98; letter-spacing: -0.025em; margin-top: 10px; }
  .cover .company { font-size: 15px; color: var(--muted); margin-top: 10px; }
  .cover .logo { width: clamp(84px, 12vw, 128px); height: auto; aspect-ratio: 1; border-radius: 50%; border: 1px solid var(--line); }
  .cover .verdict { font-family: var(--display); font-weight: 600; font-size: clamp(19px, 2.4vw, 25px); line-height: 1.38; letter-spacing: -0.01em; max-width: 34em; color: var(--ink-2); }
  .cover .verdict b { color: var(--ink); font-weight: 700; }
  .prepared { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); gap: 16px 24px; border-top: 1px solid var(--line); padding-top: 20px; }
  .prepared div { display: grid; gap: 3px; align-content: start; }
  .prepared b { font-weight: 600; font-size: 14.5px; }
  .prepared span:not(.eyebrow) { font-size: 14px; color: var(--ink-2); }

  /* at a glance */
  .glance { display: grid; gap: 18px; }
  .glance-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 20px; }
  .glance-head h2 { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
  .rows { display: grid; border-top: 1px solid var(--line); }
  .row { display: grid; grid-template-columns: 40px minmax(0, 170px) minmax(0, 1fr) 120px; gap: 6px 22px; align-items: center; padding-block: 16px; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
  .row:hover .area b { text-decoration: underline; text-underline-offset: 3px; }
  .row .n { font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .row .area { display: grid; gap: 5px; justify-items: start; }
  .row .area b { font-family: var(--display); font-size: 16px; font-weight: 700; }
  .row .find { font-size: 14.5px; color: var(--ink-2); }
  .row .find strong { color: var(--ink); font-weight: 600; }
  .row .big { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; text-align: right; font-variant-numeric: tabular-nums; }
  .row .big small { display: block; font-family: var(--body); font-size: 12px; font-weight: 500; color: var(--muted); margin-top: 5px; line-height: 1.3; }
  @media (max-width: 760px) {
    .row { grid-template-columns: 30px minmax(0, 1fr) auto; }
    .row .find { grid-column: 2 / -1; }
    .row .big { grid-row: 1; grid-column: 3; font-size: 24px; }
  }

  /* section layout */
  .sec { display: grid; grid-template-columns: minmax(0, 250px) minmax(0, 1fr); gap: 24px 48px; }
  .sec-aside { display: grid; gap: 10px; align-content: start; justify-items: start; position: sticky; top: 80px; align-self: start; }
  .sec-aside .num { font-family: var(--display); font-weight: 800; font-size: 46px; line-height: 1; color: var(--line-2); letter-spacing: -0.02em; }
  .sec-aside h2 { font-size: 24px; font-weight: 700; line-height: 1.18; letter-spacing: -0.01em; }
  .sec-aside .q { font-size: 14px; color: var(--muted); }
  .sec-body { display: grid; gap: 26px; min-width: 0; }
  .lead { font-family: var(--display); font-weight: 600; font-size: clamp(18px, 2vw, 21px); line-height: 1.42; letter-spacing: -0.005em; color: var(--ink-2); max-width: 40em; }
  .lead b { color: var(--ink); font-weight: 700; }
  h3.sub { font-size: 15px; font-weight: 700; }
  .block { display: grid; gap: 12px; }
  @media (max-width: 900px) {
    .sec { grid-template-columns: minmax(0, 1fr); }
    .sec-aside { position: static; grid-template-columns: auto minmax(0, 1fr); align-items: center; column-gap: 16px; }
    .sec-aside .num { grid-row: span 3; font-size: 40px; }
  }

  /* channel list */
  .chan { display: grid; border-top: 1px solid var(--line); }
  .chan-row { display: grid; grid-template-columns: minmax(0, 170px) 96px minmax(0, 120px) minmax(0, 1fr); gap: 4px 18px; align-items: baseline; padding-block: 12px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .chan-row .name { font-weight: 600; }
  .chan-row .name span { display: block; font-weight: 400; font-size: 12.5px; color: var(--muted); }
  .chan-row .val { font-family: var(--display); font-weight: 800; font-size: 20px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .chan-row .val small { font-family: var(--body); font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 3px; }
  .chan-row p { color: var(--ink-2); font-size: 13.5px; }
  @media (max-width: 640px) {
    .chan-row { grid-template-columns: minmax(0, 1fr) auto; }
    .chan-row .val { grid-column: 1; }
    .chan-row p { grid-column: 1 / -1; }
  }

  /* plain findings */
  .points { display: grid; margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
  .points li { padding-block: 11px; border-bottom: 1px solid var(--line); font-size: 14.5px; color: var(--ink-2); }
  .points li b { color: var(--ink); font-weight: 600; }

  /* proof */
  .proof { display: grid; gap: 10px; }
  .proof-head { display: flex; align-items: baseline; gap: 10px; }
  .proof-head h3 { font-size: 14px; font-weight: 700; font-family: var(--body); }
  .proof-head span { font-size: 12.5px; color: var(--muted); }
  .shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 12px; }
  .shots.one { grid-template-columns: minmax(0, 560px); }
  figure { margin: 0; display: grid; gap: 6px; align-content: start; }
  figure a { display: block; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--soft); }
  figure a.zoom { cursor: zoom-in; }
  figure a.zoom:hover { border-color: var(--line-2); }
  figure img { display: block; width: 100%; height: auto; }
  figcaption { font-size: 12.5px; color: var(--ink-2); line-height: 1.45; }

  /* reels chart */
  .chart { border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 12px; }
  .chart-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; align-items: baseline; }
  .chart-head b { font-size: 14px; font-weight: 600; }
  .bars { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 8px; align-items: end; height: 150px; border-bottom: 1px solid var(--line-2); }
  .bar { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; height: 100%; }
  .bar span { font-family: var(--mono); font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .bar i { display: block; width: 100%; max-width: 44px; background: var(--ink-2); border-radius: 4px 4px 0 0; }
  .bar.ai i { background: var(--faint); }
  .bar.ai span { color: var(--muted); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }

  /* boxes */
  .twin { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 12px; }
  .box { border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 10px; align-content: start; }
  .box h3 { font-size: 15px; font-weight: 700; }
  .box .big { font-family: var(--display); font-weight: 800; font-size: 46px; line-height: 1; letter-spacing: -0.02em; }
  .checks { display: grid; margin: 0; padding: 0; list-style: none; }
  .checks li { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px; padding-block: 9px; border-bottom: 1px solid var(--line); }
  .checks li:last-child { border-bottom: 0; }

  /* tables */
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
  table { border-collapse: collapse; width: 100%; min-width: 720px; font-size: 13.5px; }
  th, td { text-align: left; vertical-align: top; padding: 11px 14px; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--soft); white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  td .sm { display: block; font-size: 12.5px; color: var(--muted); }
  td.num { font-family: var(--mono); font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  td strong { font-weight: 600; }
  table.cmp { min-width: 480px; }
  table.cmp td:first-child { font-weight: 600; color: var(--ink); }

  /* funnel letter: outline only */
  .fl { display: inline-grid; place-items: center; width: 24px; height: 24px; border: 1.5px solid var(--ink); border-radius: 6px; font-family: var(--display); font-weight: 800; font-size: 13px; line-height: 1; flex: none; }

  /* funnels */
  .funnels { display: grid; gap: 10px; }
  .fun { border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 10px; }
  .fun-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .fun-top b { font-family: var(--display); font-size: 16px; font-weight: 700; }
  .fun-top .muted { font-size: 13px; }
  .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .flow li { background: var(--soft); border-radius: 7px; padding: 6px 10px; font-size: 13px; color: var(--ink); }
  .flow li.to { background: none; padding: 0 1px; color: var(--muted); }
  .fun p { font-size: 13.5px; color: var(--ink-2); }

  /* ad cards */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 12px; }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr); gap: 14px; align-items: start; }
  .card .body { display: grid; gap: 9px; }
  .card .ctop { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); }
  .card h3 { font-size: 16px; font-weight: 700; line-height: 1.3; }
  dl.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 5px 12px; margin: 0; font-size: 13px; }
  dl.facts dt { color: var(--muted); }
  dl.facts dd { margin: 0; color: var(--ink-2); }
  .quote { font-size: 13px; line-height: 1.55; background: var(--soft); border-radius: 8px; padding: 9px 11px; color: var(--ink); }
  .card .links { font-size: 13px; }
  @media (max-width: 520px) { .card { grid-template-columns: minmax(0, 1fr); } .card figure { max-width: 220px; } }

  /* stepper */
  .stepper { display: grid; margin: 0; padding: 0; list-style: none; counter-reset: s; }
  .stepper li { counter-increment: s; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; padding-bottom: 14px; position: relative; font-size: 13.5px; color: var(--ink-2); }
  .stepper li::before { content: counter(s); width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: #fff; font-weight: 600; font-size: 12.5px; display: grid; place-items: center; position: relative; z-index: 1; }
  .stepper li:not(:last-child)::after { content: ""; position: absolute; left: 13px; top: 28px; bottom: 0; width: 2px; background: var(--line); }
  .stepper li b { color: var(--ink); display: block; font-weight: 600; font-size: 14px; }
  .stepper li > div { padding-top: 3px; }

  /* plan */
  .plan { display: grid; border-top: 1px solid var(--line); }
  .plan-row { display: grid; grid-template-columns: 130px minmax(0, 1fr) minmax(0, 1fr); gap: 6px 24px; padding-block: 16px; border-bottom: 1px solid var(--line); align-items: start; }
  .plan-row .phase { font-size: 12.5px; font-weight: 600; color: var(--muted); padding-top: 2px; }
  .plan-row .phase.first { color: var(--bad); }
  .plan-row h3 { font-size: 16px; font-weight: 700; line-height: 1.3; }
  .plan-row p { font-size: 14px; color: var(--ink-2); }
  @media (max-width: 760px) { .plan-row { grid-template-columns: minmax(0, 1fr); } }
  .plain { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; color: var(--ink-2); }

  details.src > summary { cursor: pointer; font-weight: 600; font-size: 14px; }
  .sources { columns: 2 300px; column-gap: 28px; font-size: 13px; margin: 14px 0 0; padding-left: 18px; color: var(--ink-2); }
  .sources li { break-inside: avoid; margin-bottom: 6px; overflow-wrap: anywhere; }
  footer { font-size: 12.5px; color: var(--muted); text-align: center; }

  /* photo viewer */
  .lb { position: fixed; inset: 0; z-index: 50; background: rgba(16, 18, 24, 0.94); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px;
        padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px calc(env(safe-area-inset-bottom, 0px) + 14px); }
  .lb-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; max-width: 1240px; margin-inline: auto; color: #fff; }
  .lb-info { display: grid; gap: 2px; font-size: 13px; }
  .lb-info .hint { color: #B9BDC7; font-size: 12px; }
  .lb-btns { display: flex; gap: 8px; }
  .lb-btns button { height: 38px; min-width: 38px; padding: 0 12px; border: 0; border-radius: 8px; background: #fff; color: var(--ink); font: 600 14px var(--body); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .lb-btns button:hover { background: #E8EAEE; }
  .lb-btns button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .lb-btns svg { width: 16px; height: 16px; }
  .lb-stage { overflow: auto; display: grid; place-items: center; min-height: 0; }
  .lb-stage img { display: block; max-width: 100%; max-height: calc(100dvh - 150px); height: auto; border-radius: 8px; background: #fff; cursor: zoom-in; }
  .lb-stage.zoomed { place-items: start center; }
  .lb-stage.zoomed img { max-width: none; max-height: none; cursor: zoom-out; }
  .lb-cap { color: #E6E8EC; font-size: 13.5px; text-align: center; max-width: 900px; margin-inline: auto; }
  .bars.m7 { grid-template-columns: repeat(7, minmax(0, 1fr)); height: 140px; }
  .bar.zero span { color: var(--bad); font-weight: 600; }
  .months { display: grid; gap: 8px; font-size: 12px; color: var(--muted); text-align: center; }
  .months.m7 { grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .why4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 10px; }
  .why4 > div { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 6px; align-content: start; }
  .why4 .k { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: #fff; font-weight: 600; font-size: 12.5px; display: grid; place-items: center; }
  .why4 b { font-size: 15px; }
  .why4 p { font-size: 13.5px; color: var(--ink-2); line-height: 1.65; }
  .loop { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 120px), 1fr)); gap: 10px; margin: 0; padding: 0; list-style: none; counter-reset: lp; }
  .loop li { counter-increment: lp; border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 6px; align-content: start; }
  .loop li::before { content: "Step " counter(lp); font-size: 12px; font-weight: 600; color: var(--muted); }
  .loop b { font-size: 15px; }
  .loop span { font-size: 13.5px; color: var(--ink-2); line-height: 1.65; }
</style>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-ok" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="m8.5 12.2 2.4 2.4 4.6-4.8"/></symbol>
  <symbol id="i-no" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="m15 9-6 6M9 9l6 6"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M10.3 4.2 2.6 17.6A2 2 0 0 0 4.3 20.6h15.4a2 2 0 0 0 1.7-3L13.7 4.2a2 2 0 0 0-3.4 0Z"/><path d="M12 9.5v4M12 17h.01"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 16v-4.5M12 8h.01"/></symbol>
</svg>
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Screenshot viewer">
  <div class="lb-bar">
    <div class="lb-info"><span id="lbCount"></span><span class="hint">Click the picture to zoom in or out. Esc closes.</span></div>
    <div class="lb-btns">
      <button type="button" id="lbPrev" aria-label="Previous screenshot"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg></button>
      <button type="button" id="lbNext" aria-label="Next screenshot"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 3 5 5-5 5"/></svg></button>
      <button type="button" id="lbClose"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>Close</button>
    </div>
  </div>
  <div class="lb-stage" id="lbStage"><img id="lbImg" alt=""></div>
  <p class="lb-cap" id="lbCap"></p>
</div>
<script>
(function () {
  var links = Array.prototype.slice.call(document.querySelectorAll('a.zoom'));
  var lb = document.getElementById('lb'), stage = document.getElementById('lbStage'), img = document.getElementById('lbImg');
  var cap = document.getElementById('lbCap'), count = document.getElementById('lbCount'), closeBtn = document.getElementById('lbClose');
  var i = 0, last = null;
  function captionFor(a) {
    var fig = a.closest('figure'), fc = fig && fig.querySelector('figcaption');
    if (fc) return fc.textContent.trim();
    var card = a.closest('.card'), h = card && card.querySelector('h3');
    return h ? h.textContent.trim() + ' ad' : '';
  }
  function unzoom() { stage.classList.remove('zoomed'); img.style.width = ''; }
  function show(n) {
    i = (n + links.length) % links.length;
    var a = links[i];
    unzoom();
    img.src = a.getAttribute('href');
    img.alt = (a.querySelector('img') || {}).alt || '';
    cap.textContent = captionFor(a);
    count.textContent = 'Screenshot ' + (i + 1) + ' of ' + links.length;
    stage.scrollTop = 0; stage.scrollLeft = 0;
  }
  function open(n) { last = document.activeElement; show(n); lb.hidden = false; document.documentElement.style.overflow = 'hidden'; closeBtn.focus(); }
  function close() { lb.hidden = true; document.documentElement.style.overflow = ''; unzoom(); if (last && last.focus) last.focus(); }
  links.forEach(function (a, n) { a.addEventListener('click', function (e) { e.preventDefault(); open(n); }); });
  closeBtn.addEventListener('click', close);
  document.getElementById('lbPrev').addEventListener('click', function () { show(i - 1); });
  document.getElementById('lbNext').addEventListener('click', function () { show(i + 1); });
  stage.addEventListener('click', function (e) {
    if (e.target === img) {
      var z = !stage.classList.contains('zoomed');
      stage.classList.toggle('zoomed', z);
      img.style.width = z ? Math.round(img.naturalWidth * 1.5) + 'px' : '';
    } else { close(); }
  });
  document.addEventListener('keydown', function (e) {
    if (lb.hidden) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowRight') show(i + 1);
    else if (e.key === 'ArrowLeft') show(i - 1);
  });
})();
</script>
